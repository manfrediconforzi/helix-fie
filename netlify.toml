[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[redirects]]
  from = "/control"
  to = "/control/"
  status = 301
\n[[redirects]]\n  from = "/vortex"\n  to = "/vortex/"\n  status = 301\n